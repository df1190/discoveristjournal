<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Map Generator</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d1a;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#header{background:#0a0a14;padding:10px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;flex-shrink:0}
#header h1{font-size:14px;font-weight:700;color:#C9A84C;letter-spacing:.1em}
#header p{font-size:11px;color:#555}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;flex-shrink:0;background:#111120;border-right:1px solid #1e1e30;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C9A84C}
label{font-size:11px;color:#888}
input[type=text]{background:#1a1a2e;border:1px solid #2a2a40;border-radius:5px;color:#e0e0e0;font-size:12px;padding:7px 9px;width:100%;outline:none}
input[type=text]:focus{border-color:#C9A84C55}
input[type=file]{background:#1a1a2e;border:1px solid #2a2a40;border-radius:5px;color:#aaa;font-size:11px;padding:5px 8px;width:100%;cursor:pointer}
.or{text-align:center;font-size:10px;color:#444;position:relative;margin:2px 0}
.or::before,.or::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:#2a2a40}
.or::before{left:0}.or::after{right:0}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
input[type=color]{width:28px;height:24px;border:1px solid #333;border-radius:3px;padding:1px;background:none;cursor:pointer}
.terrain-row{display:flex;justify-content:space-between;align-items:center}
.toggle{position:relative;width:34px;height:18px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#333;border-radius:18px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;height:12px;width:12px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.2s}
input:checked+.slider{background:#C9A84C55;border:1px solid #C9A84C}
input:checked+.slider:before{transform:translateX(16px);background:#C9A84C}
.range-row{display:flex;flex-direction:column;gap:3px}
.range-label{display:flex;justify-content:space-between;font-size:10px;color:#666}
input[type=range]{width:100%;accent-color:#C9A84C;height:3px}
.stats-box{background:#1a1a2e;border:1px solid #2a2a40;border-radius:6px;padding:9px;font-size:11px;color:#888;line-height:1.6}
.stats-box strong{color:#C9A84C}
.btn{padding:9px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:opacity .2s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:#C9A84C;color:#0B1829}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-secondary{background:#1a2535;color:#C9A84C;border:1px solid #C9A84C33}
.btn-secondary:hover:not(:disabled){background:#1e2d40}
#status{font-size:11px;color:#666;text-align:center;min-height:16px}
#status.err{color:#e05555}
#status.ok{color:#55c87a}
#preview-area{flex:1;display:flex;align-items:center;justify-content:center;background:#080810;padding:16px;overflow:hidden}
#poster-wrap{position:relative;display:flex;flex-direction:column;box-shadow:0 8px 48px rgba(0,0,0,.7)}
#map{width:100%}
#title-canvas{display:block;width:100%}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
.maplibregl-ctrl-bottom-right{display:block!important}
.maplibregl-ctrl-group{background:#111120!important;border:1px solid #2a2a40!important}
.maplibregl-ctrl-group button{background:#111120!important;color:#C9A84C!important}
.maplibregl-ctrl-group button:hover{background:#1a1a2e!important}
.maplibregl-ctrl-compass .maplibregl-ctrl-icon{filter:invert(75%) sepia(50%) saturate(500%) hue-rotate(5deg)}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>MOTO MAP GENERATOR</h1>
    <p>Poster-quality mountain pass maps · right-click drag to rotate</p>
  </div>
</div>

<div id="main">
  <div id="sidebar">

    <div class="sec">
      <div class="sec-title">Route Input</div>
      <label>Pass or Route Name</label>
      <input type="text" id="pass-name" placeholder="Stelvio Pass, Col du Galibier…">
      <div class="or">or</div>
      <label>Start Coordinates</label>
      <input type="text" id="coord-from" placeholder="46.52, 10.45">
      <label>End Coordinates</label>
      <input type="text" id="coord-to" placeholder="46.61, 10.52">
      <div class="or">or</div>
      <label>GPX File</label>
      <input type="file" id="gpx-file" accept=".gpx">
      <label>KML File (Google My Maps export)</label>
      <input type="file" id="kml-file" accept=".kml,.kmz">
    </div>

    <div class="sec">
      <div class="sec-title">Poster Text</div>
      <label>Title</label>
      <input type="text" id="title-input" placeholder="STELVIO PASS">
      <label>Subtitle / Country</label>
      <input type="text" id="subtitle-input" placeholder="ITALY">
    </div>

    <div class="sec">
      <div class="sec-title">Colors</div>
      <div class="color-row">
        <div class="color-item">
          <input type="color" id="color-bg" value="#0B1829">
          <span>Background</span>
        </div>
        <div class="color-item">
          <input type="color" id="color-road" value="#C9A84C">
          <span>Roads</span>
        </div>
        <div class="color-item">
          <input type="color" id="color-route" value="#FFFFFF">
          <span>Route</span>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Terrain</div>
      <div class="terrain-row">
        <label style="color:#aaa">Hillshading</label>
        <label class="toggle">
          <input type="checkbox" id="toggle-hillshade" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="range-row">
        <div class="range-label"><span>Intensity</span><span id="hillshade-val">35%</span></div>
        <input type="range" id="hillshade-intensity" min="0" max="100" value="35">
      </div>
    </div>

    <div class="sec" id="stats-wrap" style="display:none">
      <div class="stats-box" id="stats-text"></div>
    </div>

    <div class="sec">
      <button class="btn btn-primary" id="btn-generate">Generate Map</button>
      <div id="status"></div>
      <button class="btn btn-secondary" id="btn-svg" disabled>Download SVG</button>
      <button class="btn btn-secondary" id="btn-png" disabled>Download PNG (300 DPI)</button>
    </div>

  </div>

  <div id="preview-area">
    <div id="poster-wrap">
      <div id="map"></div>
      <canvas id="title-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const POSTER_W = 2400, POSTER_H = 3400, TITLE_H = 420;
const MAP_H = POSTER_H - TITLE_H; // 2980
const PRINT_SCALE = 3; // 7200 × 10200 px

const ROAD_STYLES = [
  { classes:["footway","cycleway","path","steps","bridleway"], opacity:.14, width:.5  },
  { classes:["track"],                                          opacity:.22, width:.7  },
  { classes:["service","living_street"],                        opacity:.35, width:.9  },
  { classes:["residential","pedestrian"],                       opacity:.50, width:1.3 },
  { classes:["unclassified"],                                   opacity:.60, width:1.7 },
  { classes:["tertiary","tertiary_link"],                       opacity:.72, width:2.2 },
  { classes:["secondary","secondary_link"],                     opacity:.82, width:3.0 },
  { classes:["primary","primary_link"],                         opacity:.90, width:4.0 },
  { classes:["trunk","trunk_link"],                             opacity:.96, width:5.0 },
  { classes:["motorway","motorway_link"],                       opacity:1.0, width:6.0 },
];

const OVERPASS_MIRRORS = [
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass-api.de/api/interpreter",
  "https://lz4.overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

// ── State ──────────────────────────────────────────────────────────────────
let map = null;
let routePoints = [];
let roadElements = [];
let routeStats = {};
let posterReady = false;

// ── Layout ─────────────────────────────────────────────────────────────────
function layoutPoster() {
  const area = document.getElementById("preview-area");
  const wrap = document.getElementById("poster-wrap");
  const tc   = document.getElementById("title-canvas");

  const aw = area.clientWidth  - 32;
  const ah = area.clientHeight - 32;
  const aspect = POSTER_W / POSTER_H;

  const pw = (aw / ah < aspect) ? aw : ah * aspect;
  const mapPx   = pw / POSTER_W * MAP_H;
  const titlePx = pw / POSTER_W * TITLE_H;

  wrap.style.width = pw + "px";
  document.getElementById("map").style.height = mapPx + "px";
  tc.style.height = titlePx + "px";
  tc.width  = Math.round(pw * 2);
  tc.height = Math.round(titlePx * 2);
  tc.style.width = pw + "px";

  if (map) map.resize();
  drawTitleBlock();
}
window.addEventListener("resize", layoutPoster);

// ── MapLibre style builder ─────────────────────────────────────────────────
function hillshadeExp() {
  if (!document.getElementById("toggle-hillshade").checked) return 0;
  return (parseInt(document.getElementById("hillshade-intensity").value) / 100) * 0.8;
}

function buildStyle(bgColor) {
  return {
    version: 8,
    sources: {
      terrain: {
        type: "raster-dem",
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        encoding: "terrarium",
        tileSize: 256,
        maxzoom: 14,
      }
    },
    layers: [
      { id:"bg", type:"background", paint:{"background-color": bgColor} },
      {
        id: "hillshade",
        type: "hillshade",
        source: "terrain",
        paint: {
          "hillshade-shadow-color":         "#000000",
          "hillshade-highlight-color":      "#ffffff",
          "hillshade-illumination-direction": 315,
          "hillshade-illumination-anchor":  "map",
          "hillshade-exaggeration":         hillshadeExp(),
          "hillshade-accent-color":         bgColor,
        }
      }
    ]
  };
}

// ── Init map ───────────────────────────────────────────────────────────────
function initMap() {
  const bg = document.getElementById("color-bg").value;
  map = new maplibregl.Map({
    container: "map",
    style: buildStyle(bg),
    center: [10.45, 46.52],
    zoom: 9,
    preserveDrawingBuffer: true,
    attributionControl: false,
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "bottom-right");
  map.on("styledata", () => { if (roadElements.length && map.isStyleLoaded()) addMapLayers(map); });
}

// ── Add layers to a MapLibre instance ─────────────────────────────────────
function addMapLayers(m) {
  const roadColor  = document.getElementById("color-road").value;
  const routeColor = document.getElementById("color-route").value;

  // Remove existing
  [...Array(ROAD_STYLES.length)].forEach((_,i) => {
    if (m.getLayer("roads-"+i)) m.removeLayer("roads-"+i);
  });
  ["route-glow","route-line"].forEach(id => { if (m.getLayer(id)) m.removeLayer(id); });
  if (m.getSource("roads")) m.removeSource("roads");
  if (m.getSource("route")) m.removeSource("route");

  // Road network
  if (roadElements.length) {
    m.addSource("roads", { type:"geojson", data: toGeoJSON(roadElements) });
    ROAD_STYLES.forEach((s,i) => {
      m.addLayer({
        id: "roads-"+i, type:"line", source:"roads",
        filter: ["match", ["get","highway"], s.classes, true, false],
        paint: { "line-color":roadColor, "line-opacity":s.opacity, "line-width":s.width },
        layout: { "line-cap":"round","line-join":"round" }
      });
    });
  }

  // Route
  if (routePoints.length) {
    m.addSource("route", {
      type:"geojson",
      data:{ type:"Feature", geometry:{ type:"LineString",
        coordinates: routePoints.map(p=>[p.lon,p.lat]) }}
    });
    m.addLayer({ id:"route-glow", type:"line", source:"route",
      paint:{ "line-color":routeColor,"line-opacity":.30,"line-width":20,"line-blur":8 },
      layout:{"line-cap":"round","line-join":"round"} });
    m.addLayer({ id:"route-line", type:"line", source:"route",
      paint:{ "line-color":routeColor,"line-opacity":1,"line-width":6 },
      layout:{"line-cap":"round","line-join":"round"} });
  }
}

function updateMapLayers() {
  if (!map || !map.isStyleLoaded()) return;
  addMapLayers(map);
}

// ── Overpass elements → GeoJSON ────────────────────────────────────────────
function toGeoJSON(elements) {
  return {
    type:"FeatureCollection",
    features: elements
      .filter(e => e.type==="way" && e.geometry?.length > 1)
      .map(e => ({
        type:"Feature",
        geometry:{ type:"LineString", coordinates: e.geometry.map(p=>[p.lon,p.lat]) },
        properties:{ highway: e.tags?.highway || "unclassified" }
      }))
  };
}

// ── Overpass API ───────────────────────────────────────────────────────────
async function overpass(query) {
  const body = "data=" + encodeURIComponent(query);
  for (const mirror of OVERPASS_MIRRORS) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 90000);
      const r = await fetch(mirror, {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body, signal: ctrl.signal
      });
      clearTimeout(t);
      if (r.ok) return (await r.json()).elements || [];
      console.warn(mirror, r.status);
    } catch(e) { console.warn(mirror, e.message); }
  }
  throw new Error("OpenStreetMap server unavailable. Check your internet connection.");
}

async function fetchRoads(bbox) {
  const [S,W,N,E] = bbox;
  const pad=.04, s=(S-pad).toFixed(6), w=(W-pad).toFixed(6), n=(N+pad).toFixed(6), e=(E+pad).toFixed(6);
  return overpass(`[out:json][timeout:90];(way["highway"~"motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|service|living_street|pedestrian|track|path|footway|cycleway|steps|bridleway"](${s},${w},${n},${e}););out geom;`);
}

// ── Parse GPX ─────────────────────────────────────────────────────────────
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, "text/xml");
  return [...doc.querySelectorAll("trkpt,rtept,wpt")].map(el => {
    const ele = el.querySelector("ele");
    return { lat:+el.getAttribute("lat"), lon:+el.getAttribute("lon"), ele: ele ? +ele.textContent : null };
  }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
}

// ── Parse KML ─────────────────────────────────────────────────────────────
function parseKML(text) {
  const doc = new DOMParser().parseFromString(text, "text/xml");
  for (const el of doc.querySelectorAll("coordinates")) {
    const pts = el.textContent.trim().split(/\s+/).map(s => {
      const [lon,lat,ele] = s.split(",").map(Number);
      return { lat, lon, ele: isNaN(ele)?null:ele };
    }).filter(p => !isNaN(p.lat));
    if (pts.length > 1) return pts;
  }
  // gx:coord fallback
  return [...doc.querySelectorAll("coord")].map(c => {
    const [lon,lat,ele] = c.textContent.trim().split(" ").map(Number);
    return { lat, lon, ele: isNaN(ele)?null:ele };
  }).filter(p => !isNaN(p.lat));
}

// ── Geocoding + routing ────────────────────────────────────────────────────
async function geocode(name) {
  const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`,
    { headers:{"User-Agent":"DiscoveristMapGenerator/2.0"} });
  const d = await r.json();
  if (!d.length) throw new Error(`Location not found: "${name}"`);
  return { lat:+d[0].lat, lon:+d[0].lon };
}

async function routeOSRM(la1,lo1,la2,lo2) {
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${lo1},${la1};${lo2},${la2}?overview=full&geometries=geojson`);
  const d = await r.json();
  if (!d.routes?.length) throw new Error("No route found between these coordinates.");
  return d.routes[0].geometry.coordinates.map(([lon,lat]) => ({lat,lon,ele:null}));
}

async function resolvePassName(name) {
  setStatus("Geocoding location…");
  const c = await geocode(name);
  const pad=.15;
  setStatus("Finding road…");
  const els = await overpass(`[out:json][timeout:60];(way["highway"~"primary|secondary|tertiary|unclassified|trunk|motorway"](${c.lat-pad},${c.lon-pad},${c.lat+pad},${c.lon+pad}););out geom;`);
  if (!els.length) throw new Error("No roads found near this location.");
  let best=null, bestD=Infinity;
  for (const w of els.filter(e=>e.type==="way"&&e.geometry?.length>5)) {
    for (const p of w.geometry) {
      const d=Math.hypot(p.lat-c.lat, p.lon-c.lon);
      if (d<bestD){ bestD=d; best=w; }
    }
  }
  if (!best) throw new Error("Could not find a road near this location.");
  const g=best.geometry, s=g[0], e=g[g.length-1];
  setStatus("Routing…");
  return routeOSRM(s.lat,s.lon,e.lat,e.lon);
}

// ── Stats ──────────────────────────────────────────────────────────────────
function haversine(la1,lo1,la2,lo2) {
  const R=6371000, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcStats(pts) {
  let dist=0, gain=0;
  for (let i=1;i<pts.length;i++) {
    dist += haversine(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
    if (pts[i].ele!=null&&pts[i-1].ele!=null&&pts[i].ele>pts[i-1].ele) gain+=pts[i].ele-pts[i-1].ele;
  }
  const lats=pts.map(p=>p.lat), lons=pts.map(p=>p.lon);
  return {
    distKm:(dist/1000).toFixed(1),
    elevGain:Math.round(gain),
    hasEle:pts.some(p=>p.ele!=null),
    centerLat:(Math.min(...lats)+Math.max(...lats))/2,
    centerLon:(Math.min(...lons)+Math.max(...lons))/2,
    bbox:[Math.min(...lats),Math.min(...lons),Math.max(...lats),Math.max(...lons)]
  };
}

function fmtCoord(lat,lon) {
  return `${Math.abs(lat).toFixed(4)}° ${lat>=0?"N":"S"}  /  ${Math.abs(lon).toFixed(4)}° ${lon>=0?"E":"W"}`;
}

// ── Title block renderer (shared: preview canvas + export ctx) ─────────────
function renderTitleBlock(ctx, W, H, yOff, sc) {
  const bg   = document.getElementById("color-bg").value;
  const gold = document.getElementById("color-road").value;
  const title= (document.getElementById("title-input").value||"MOUNTAIN PASS").toUpperCase();
  const sub  = (document.getElementById("subtitle-input").value||"").toUpperCase();

  ctx.fillStyle = bg;
  ctx.fillRect(0, yOff, W, H);

  ctx.strokeStyle = gold;
  ctx.lineWidth = Math.max(1, 2*sc);

  const lx1=Math.round(60*sc), lx2=W-Math.round(60*sc);
  ctx.beginPath(); ctx.moveTo(lx1, yOff+Math.round(18*sc)); ctx.lineTo(lx2, yOff+Math.round(18*sc)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx1, yOff+H-Math.round(18*sc)); ctx.lineTo(lx2, yOff+H-Math.round(18*sc)); ctx.stroke();

  ctx.textAlign="center";

  ctx.font = `700 ${Math.round(88*sc)}px Arial, sans-serif`;
  ctx.fillStyle = gold;
  ctx.letterSpacing = `${Math.round(10*sc)}px`;
  ctx.fillText(title, W/2, yOff + Math.round(104*sc));

  if (sub) {
    ctx.font = `400 ${Math.round(28*sc)}px Arial, sans-serif`;
    ctx.fillStyle = gold;
    ctx.globalAlpha = .72;
    ctx.letterSpacing = `${Math.round(5*sc)}px`;
    ctx.fillText(sub, W/2, yOff + Math.round(148*sc));
    ctx.globalAlpha = 1;
  }

  ctx.letterSpacing = "0px";

  if (routeStats.distKm) {
    let st = `${routeStats.distKm} km`;
    if (routeStats.hasEle && routeStats.elevGain>0) st += `  ·  ${routeStats.elevGain.toLocaleString()} m gain`;
    ctx.font = `300 ${Math.round(22*sc)}px Arial, sans-serif`;
    ctx.fillStyle = gold;
    ctx.globalAlpha = .60;
    ctx.fillText(st, W/2, yOff + Math.round(210*sc));
    ctx.globalAlpha = 1;

    ctx.font = `300 ${Math.round(17*sc)}px "Courier New", monospace`;
    ctx.globalAlpha = .45;
    ctx.fillText(fmtCoord(routeStats.centerLat,routeStats.centerLon), W/2, yOff+Math.round(244*sc));
    ctx.globalAlpha = 1;
  }

  ctx.font = `300 ${Math.round(13*sc)}px Arial, sans-serif`;
  ctx.globalAlpha = .28;
  ctx.fillText("© OpenStreetMap contributors", W/2, yOff+H-Math.round(30*sc));
  ctx.globalAlpha = 1;
}

function drawTitleBlock() {
  const tc = document.getElementById("title-canvas");
  if (!tc.width) return;
  const ctx = tc.getContext("2d");
  const sc = tc.width / POSTER_W;
  renderTitleBlock(ctx, tc.width, tc.height, 0, sc);
}

// ── Status helper ──────────────────────────────────────────────────────────
function setStatus(msg, cls="") {
  const el=document.getElementById("status");
  el.textContent=msg; el.className=cls;
}

// ── Generate ───────────────────────────────────────────────────────────────
async function generate() {
  const btn=document.getElementById("btn-generate");
  btn.disabled=true; posterReady=false;
  document.getElementById("btn-svg").disabled=true;
  document.getElementById("btn-png").disabled=true;
  document.getElementById("stats-wrap").style.display="none";

  try {
    let pts=[];
    const gpx=document.getElementById("gpx-file").files[0];
    const kml=document.getElementById("kml-file").files[0];
    const name=document.getElementById("pass-name").value.trim();
    const cf=document.getElementById("coord-from").value.trim();
    const ct=document.getElementById("coord-to").value.trim();

    if (gpx) {
      setStatus("Parsing GPX…");
      pts=parseGPX(await gpx.text());
      if (!pts.length) throw new Error("No track points found in GPX file.");
    } else if (kml) {
      setStatus("Parsing KML…");
      pts=parseKML(await kml.text());
      if (!pts.length) throw new Error("No route found in KML. Export as KML from Google My Maps.");
    } else if (cf && ct) {
      setStatus("Routing between coordinates…");
      const [la1,lo1]=cf.split(",").map(Number), [la2,lo2]=ct.split(",").map(Number);
      if ([la1,lo1,la2,lo2].some(isNaN)) throw new Error("Invalid coordinates. Use: 46.52, 10.45");
      pts=await routeOSRM(la1,lo1,la2,lo2);
    } else if (name) {
      pts=await resolvePassName(name);
    } else {
      throw new Error("Enter a pass name, coordinates, or upload a GPX/KML file.");
    }

    if (pts.length<2) throw new Error("Route has too few points.");

    // Decimate if very dense
    if (pts.length>3000) {
      const step=Math.ceil(pts.length/3000);
      pts=pts.filter((_,i)=>i%step===0||i===pts.length-1);
    }

    routePoints=pts;
    routeStats=calcStats(pts);

    if (name && !document.getElementById("title-input").value)
      document.getElementById("title-input").value=name.toUpperCase();

    const st=routeStats;
    let html=`<strong>${st.distKm} km</strong>`;
    if (st.hasEle&&st.elevGain>0) html+=` · <strong>${st.elevGain.toLocaleString()} m</strong> gain`;
    html+=`<br><span style="opacity:.5">${fmtCoord(st.centerLat,st.centerLon)}</span>`;
    document.getElementById("stats-text").innerHTML=html;
    document.getElementById("stats-wrap").style.display="";

    setStatus("Fetching road network from OpenStreetMap…");
    roadElements=await fetchRoads(st.bbox);

    setStatus("Rendering map…");
    const [S,W,N,E]=st.bbox;
    if (!map.isStyleLoaded()) await new Promise(res=>map.once("style.load",res));
    map.fitBounds([[W,S],[E,N]],{padding:60,duration:600});
    updateMapLayers();
    drawTitleBlock();

    // Wait for camera + tile loading to settle, then re-confirm layers are present
    await new Promise(res=>map.once("idle",res));
    updateMapLayers();

    posterReady=true;
    document.getElementById("btn-svg").disabled=false;
    document.getElementById("btn-png").disabled=false;
    setStatus("Map ready.", "ok");

  } catch(e) {
    setStatus(e.message,"err");
    console.error(e);
  }
  btn.disabled=false;
}

// ── SVG Export ─────────────────────────────────────────────────────────────
function buildSVG() {
  if (!routePoints.length) return null;
  const [S,W,N,E]=routeStats.bbox;
  const pad=.05, mn=S-pad, mx=N+pad, mw=W-pad, me=E+pad;
  const merY=la=>Math.log(Math.tan(Math.PI/4+la*Math.PI/360));
  const y0=merY(mn),y1=merY(mx),xR=me-mw,yR=y1-y0;
  const proj=(la,lo)=>[
    (lo-mw)/xR*POSTER_W,
    MAP_H-(merY(la)-y0)/yR*MAP_H
  ];
  const road=document.getElementById("color-road").value;
  const route=document.getElementById("color-route").value;
  const bg=document.getElementById("color-bg").value;
  const title=(document.getElementById("title-input").value||"MOUNTAIN PASS").toUpperCase();
  const sub=(document.getElementById("subtitle-input").value||"").toUpperCase();

  let paths="";
  for (const s of ROAD_STYLES) {
    for (const w of roadElements.filter(e=>e.type==="way"&&e.geometry&&s.classes.includes(e.tags?.highway))) {
      const d="M "+w.geometry.map(p=>proj(p.lat,p.lon).map(v=>v.toFixed(1)).join(",")).join(" L ");
      paths+=`<path d="${d}" stroke="${road}" stroke-opacity="${s.opacity}" stroke-width="${s.width}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  const rd="M "+routePoints.map(p=>proj(p.lat,p.lon).map(v=>v.toFixed(1)).join(",")).join(" L ");
  const st=routeStats;
  const ty=MAP_H;

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${POSTER_W}" height="${POSTER_H}" viewBox="0 0 ${POSTER_W} ${POSTER_H}">
<defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="${POSTER_W}" height="${POSTER_H}" fill="${bg}"/>
<g id="roads">${paths}</g>
<path d="${rd}" stroke="${route}" stroke-opacity=".22" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="${rd}" stroke="${route}" stroke-opacity="1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="0" y="${ty}" width="${POSTER_W}" height="${TITLE_H}" fill="${bg}"/>
<line x1="60" y1="${ty+18}" x2="${POSTER_W-60}" y2="${ty+18}" stroke="${road}" stroke-width="2"/>
<line x1="60" y1="${POSTER_H-18}" x2="${POSTER_W-60}" y2="${POSTER_H-18}" stroke="${road}" stroke-width="2"/>
<text x="${POSTER_W/2}" y="${ty+104}" font-family="Arial Narrow,Arial,sans-serif" font-size="88" font-weight="700" fill="${road}" text-anchor="middle" letter-spacing="10">${title}</text>
${sub?`<text x="${POSTER_W/2}" y="${ty+148}" font-family="Arial,sans-serif" font-size="28" fill="${road}" text-anchor="middle" letter-spacing="5" opacity=".72">${sub}</text>`:""}
${st.distKm?`<text x="${POSTER_W/2}" y="${ty+210}" font-family="Arial,sans-serif" font-size="22" font-weight="300" fill="${road}" text-anchor="middle" opacity=".60">${st.distKm} km${st.hasEle&&st.elevGain>0?` · ${st.elevGain.toLocaleString()} m gain`:""}</text>
<text x="${POSTER_W/2}" y="${ty+244}" font-family="Courier New,monospace" font-size="17" font-weight="300" fill="${road}" text-anchor="middle" opacity=".45">${fmtCoord(st.centerLat,st.centerLon)}</text>`:""}
<text x="${POSTER_W/2}" y="${POSTER_H-30}" font-family="Arial,sans-serif" font-size="13" font-weight="300" fill="${road}" text-anchor="middle" opacity=".28">© OpenStreetMap contributors</text>
</svg>`;
}

function downloadSVG() {
  const svg=buildSVG();
  if (!svg){setStatus("No route data.","err");return;}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  a.download=(document.getElementById("title-input").value||"moto-map").toLowerCase().replace(/\s+/g,"-")+".svg";
  a.click(); URL.revokeObjectURL(a.href);
  setStatus("SVG downloaded.","ok");
}

// ── PNG Export ─────────────────────────────────────────────────────────────
async function exportPNG() {
  if (!posterReady) return;
  setStatus("Generating print PNG (this takes ~20 s)…");
  document.getElementById("btn-png").disabled=true;

  try {
    const PW=POSTER_W*PRINT_SCALE;  // 7200
    const PMH=MAP_H*PRINT_SCALE;    // 8940
    const PTH=TITLE_H*PRINT_SCALE;  // 1260
    const PH=POSTER_H*PRINT_SCALE;  // 10200

    const offDiv=document.createElement("div");
    offDiv.style.cssText=`position:fixed;left:-99999px;top:0;width:${POSTER_W}px;height:${MAP_H}px;`;
    document.body.appendChild(offDiv);

    const bg=document.getElementById("color-bg").value;
    const printMap=new maplibregl.Map({
      container:offDiv,
      style:buildStyle(bg),
      center:map.getCenter(),
      zoom:map.getZoom(),
      bearing:map.getBearing(),
      pitch:map.getPitch(),
      pixelRatio:PRINT_SCALE,
      preserveDrawingBuffer:true,
      attributionControl:false,
      interactive:false,
    });

    await new Promise((res,rej)=>{
      printMap.on("load",res);
      setTimeout(()=>rej(new Error("Print map load timeout")),30000);
    });

    printMap.setPaintProperty("hillshade","hillshade-exaggeration",hillshadeExp());
    addMapLayers(printMap);

    await new Promise((res,rej)=>{
      printMap.once("idle",res);
      setTimeout(()=>rej(new Error("Render timeout")),30000);
    });

    const mapCanvas=printMap.getCanvas();
    const final=document.createElement("canvas");
    final.width=PW; final.height=PH;
    const ctx=final.getContext("2d");
    ctx.drawImage(mapCanvas,0,0,PW,PMH);
    renderTitleBlock(ctx,PW,PTH,PMH,PW/POSTER_W);

    await new Promise(res=>{
      final.toBlob(blob=>{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=(document.getElementById("title-input").value||"moto-map").toLowerCase().replace(/\s+/g,"-")+"-print.png";
        a.click(); URL.revokeObjectURL(a.href);
        res();
      },"image/png");
    });

    printMap.remove();
    document.body.removeChild(offDiv);
    setStatus("PNG downloaded (7200×10200 px).", "ok");

  } catch(e) {
    setStatus("Export failed: "+e.message,"err");
    console.error(e);
  }
  document.getElementById("btn-png").disabled=false;
}

// ── Live color / terrain updates ───────────────────────────────────────────
function onColorChange() {
  if (!map) return;
  const bg=document.getElementById("color-bg").value;
  map.setPaintProperty("bg","background-color",bg);
  map.setPaintProperty("hillshade","hillshade-accent-color",bg);
  updateMapLayers();
  drawTitleBlock();
}

function onHillshadeChange() {
  if (!map) return;
  map.setPaintProperty("hillshade","hillshade-exaggeration",hillshadeExp());
  const on=document.getElementById("toggle-hillshade").checked;
  document.getElementById("hillshade-val").textContent=on?document.getElementById("hillshade-intensity").value+"%":"Off";
}

// ── Event listeners ────────────────────────────────────────────────────────
document.getElementById("btn-generate").addEventListener("click",generate);
document.getElementById("btn-svg").addEventListener("click",downloadSVG);
document.getElementById("btn-png").addEventListener("click",exportPNG);
document.getElementById("pass-name").addEventListener("keydown",e=>{ if(e.key==="Enter") generate(); });
["color-bg","color-road","color-route"].forEach(id=>document.getElementById(id).addEventListener("input",onColorChange));
["title-input","subtitle-input"].forEach(id=>document.getElementById(id).addEventListener("input",drawTitleBlock));
document.getElementById("toggle-hillshade").addEventListener("change",onHillshadeChange);
document.getElementById("hillshade-intensity").addEventListener("input",()=>{
  document.getElementById("hillshade-val").textContent=document.getElementById("hillshade-intensity").value+"%";
  onHillshadeChange();
});

// ── Boot ───────────────────────────────────────────────────────────────────
layoutPoster();
initMap();
</script>
